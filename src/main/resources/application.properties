# ==========================================
# Configuración de Base de Datos H2
# ==========================================
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.driver=org.h2.Driver
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb
quarkus.datasource.username=sa
quarkus.datasource.password=

quarkus.hibernate-orm.database.generation=update

quarkus.h2.console.enabled=true
quarkus.h2.console.path=/h2-console

# ==========================================
# Configuración del Rest Client
# ==========================================
quarkus.rest-client.exchange-api.url=https://free.e-api.net.pe
quarkus.rest-client.exchange-api.connect-timeout=5000
quarkus.rest-client.exchange-api.read-timeout=10000

# Configuración correcta para ignorar certificados SSL en Quarkus Rest Client
quarkus.rest-client."com.nttdata.proxy.ExchangeRateProxy".trust-all=true
quarkus.rest-client."com.nttdata.proxy.ExchangeRateProxy".verify-host=false